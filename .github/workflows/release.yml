name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: nooon-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: nooon-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: nooon-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: nooon-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build --compile src/index.ts \
            --outfile ${{ matrix.artifact }} \
            --target ${{ matrix.target }} \
            --define "PKG_VERSION='$(jq -r .version package.json)'"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            artifacts/nooon-linux-x64/nooon-linux-x64
            artifacts/nooon-linux-arm64/nooon-linux-arm64
            artifacts/nooon-darwin-x64/nooon-darwin-x64
            artifacts/nooon-darwin-arm64/nooon-darwin-arm64
