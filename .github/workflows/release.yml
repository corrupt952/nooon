name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: nooon-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: nooon-linux-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: nooon-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: nooon-darwin-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          bun build --compile src/index.ts \
            --outfile ${{ matrix.artifact }} \
            --target ${{ matrix.target }} \
            --define "PKG_VERSION='$(jq -r .version package.json)'"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            artifacts/nooon-linux-x64/nooon-linux-x64
            artifacts/nooon-linux-arm64/nooon-linux-arm64
            artifacts/nooon-darwin-x64/nooon-darwin-x64
            artifacts/nooon-darwin-arm64/nooon-darwin-arm64
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --notes ""
          fi
